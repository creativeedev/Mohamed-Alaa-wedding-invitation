<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Engagement Invitation</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container-fluid invitation">

    <div class="row h-100">

        <div class="col-12 d-flex justify-content-center align-items-start">

            <div class="text-center content">

                <p class="subtitle">
                    Wedding Invitation
                </p>

                <h1 class="name">
                    Mohamed
                </h1>

                <div class="and">
                    &
                </div>

                <h1 class="name">
                    A 'laa
                </h1>

                <p class="date">
                    Monday, 9 November 2026 · 7:00 PM
                </p>

            </div>

        </div>

    </div>

</div>

<div class="container d-flex flex-column align-items-center justify-content-center min-vh-100">

    <!-- Calendar Card -->
    <div class="calendar-card">

        <div class="calendar-header d-flex justify-content-between px-3">
            <span>2026</span>
            <strong>November</strong>
            <span>Mon</span>
        </div>

        <div class="calendar-body text-center">
            <h1>9</h1>
            <p class="day">Monday</p>
            <h5>7:00 PM</h5>
        </div>

    </div>

    <!-- Button -->

    <button class="btn save-btn mt-4" onclick="downloadICS()">
    <i class="bi bi-calendar-event"></i>
    Save the Date
    </button>

    <!-- Countdown -->

    <div class="countdown glass mt-5">

        <h6>Countdown</h6>

        <div class="row mt-3">

            <div class="col">
                <div class="time-box">
                    <span id="days">00</span>
                    <small>Days</small>
                </div>
            </div>

            <div class="col">
                <div class="time-box">
                    <span id="hours">00</span>
                    <small>Hours</small>
                </div>
            </div>

            <div class="col">
                <div class="time-box">
                    <span id="minutes">00</span>
                    <small>Min</small>
                </div>
            </div>

            <div class="col">
                <div class="time-box">
                    <span id="seconds">00</span>
                    <small>Sec</small>
                </div>
            </div>

        </div>

    </div>

</div>

<div class="location-section text-center mt-5">

    <p class="location-title">Location</p>

    <h6 class="location-name">C'est la Vie Place</h6>

    <button class="location-btn mt-3" onclick="openLocation()">
    <i class="bi bi-geo-alt-fill"></i>
    Open Location
    </button>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // تاريخ الحدث
    const targetDate = new Date("November 9, 2026 19:00:00").getTime();

    function updateCountdown() {

        const now = new Date().getTime();
        const distance = targetDate - now;

        // لو الحدث بدأ
        if (distance <= 0) {
            document.getElementById("days").innerHTML = "00";
            document.getElementById("hours").innerHTML = "00";
            document.getElementById("minutes").innerHTML = "00";
            document.getElementById("seconds").innerHTML = "00";
            return;
        }

        // الحسابات
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));

        const hours = Math.floor(
            (distance % (1000 * 60 * 60 * 24)) /
            (1000 * 60 * 60)
        );

        const minutes = Math.floor(
            (distance % (1000 * 60 * 60)) /
            (1000 * 60)
        );

        const seconds = Math.floor(
            (distance % (1000 * 60)) /
            1000
        );

        // عرض الأرقام مع صفر في البداية
        document.getElementById("days").innerHTML = String(days).padStart(2, "0");
        document.getElementById("hours").innerHTML = String(hours).padStart(2, "0");
        document.getElementById("minutes").innerHTML = String(minutes).padStart(2, "0");
        document.getElementById("seconds").innerHTML = String(seconds).padStart(2, "0");
    }

    // تشغيل العداد
    updateCountdown();
    setInterval(updateCountdown, 1000);

     // كود زر Save the Date
    function downloadICS() {

        const ics =
`BEGIN:VCALENDAR
VERSION:2.0
BEGIN:VEVENT
SUMMARY:Mohamed & Alaa - Wedding
DTSTART:20261109T190000
DTEND:20261109T230000
LOCATION:C'EST LA VIE PLACE
DESCRIPTION:Wedding Invitation
END:VEVENT
END:VCALENDAR`;

        const blob = new Blob([ics], {type:"text/calendar"});
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "SaveTheDate.ics";
        link.click();
    }

    function openLocation() {
    window.open("https://maps.apple/p/pzeYohBi5Kj6Qd", "_blank");
    }
    

</script>

</body>

</html>
